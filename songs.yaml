# Top 50 of 2026 — all the content for the site lives in this file.
#
# How to edit:
#   - Each song starts with "- rank:".
#   - Text in [square brackets] is a placeholder waiting for your writing.
#   - For the essay, write normal paragraphs under "essay: |".
#     Leave a blank line between paragraphs. Keep the two-space indent.
#   - "photo" is optional. Leave it out and the site shows a red dotted placeholder.

site:
  # true = a hidden preview: search engines are asked not to list the site.
  # Change to false on launch day.
  hidden_preview: true
  year: 2026
  list_size: 50
  title: "Top 50 of 2026"
  author: "Dan Wipert"
  editors_note: "[Two or three short lines about this year's list: what it is, how you picked them, and how to use the page.]"

songs:
  # NOTE: the ranks below are stand-ins for testing the design.

  - rank: 50
    slug: something-else
    title: "Something Else"
    artist: "Joshua Burnside"
    hometown: "Belfast, N. Ireland"
    record_label: "Nettwerk"
    release_month: "January"
    genre_scene: "[GENRE / SCENE]"
    photo: "img/photos/joshua-burnside.jpg"
    photo_alt: "Joshua Burnside seated in an empty concert hall beside a guitar"
    photo_credit: "Photo: courtesy of Nettwerk"
    headline: "[Your headline goes here, big and loud]"
    standfirst: "[One-sentence standfirst: the hook that makes someone want to read on.]"
    pull_quote: "[Pull quote — one line of your own writing]"
    essay: |
      [Opening paragraph: where you were when this song found you, and the first thing that grabbed you about it.]

      [Second paragraph: what the song is doing — the sound, the build, the moment it turns.]

      [Third paragraph: why it earned its spot this year, and who should hear it.]
    duration: "3:00"
    # "In their own words": a short quote from the artist (keep it under ~15 words),
    # who it's from and where they said it. All optional.
    quote: "There is something so comforting about Mulder and Scully's relationship."
    quote_source: "Track notes for “Something Else,” via Atwood Magazine, March 2026"
    quote_url: "https://atwoodmagazine.com/jbok-joshua-burnside-its-not-going-to-be-okay-album-interview-music-feature/"
    # One line that hands the reader off to the next song (optional).
    segue: "[One line that hands you off to the next song…]"
    # Where to hear it. Leave any of these out and that row just won't show.
    bandcamp_url: "https://joshuaburnside.bandcamp.com/track/something-else"
    bandcamp_track_id: "1776485615"   # from the Bandcamp page's Share/Embed code; lets it play on the page
